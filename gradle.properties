pluginGroup=dev.tokitoki
pluginVersion=0.1.0

# The IntelliJ Platform the plugin compiles against: the oldest it supports.
# Newer IDEs run it through binary compatibility; verifyPlugin checks them.
platformVersion=2024.2.5
# The newest released platform verifyPlugin also checks against.
verifyPlatformVersion=2025.2.4

# A release build reports to production and owns the installed data directory.
# Everything else — runIde, a local buildPlugin — is a dev build: it talks to
# the local server and keeps its state in ~/.tokitoki-dev, so it can never
# touch what the installed clients own. CI passes -PtokitokiRelease=true.
tokitokiRelease=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
