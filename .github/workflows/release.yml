name: Release

# Pushing a semver tag (v0.2.0) on main builds the plugin with the pinned
# CLI release, publishes the ZIP as a GitHub release, and uploads it to the
# JetBrains Marketplace. Nothing here can talk to production by accident:
# -PtokitokiRelease=true is what stamps the production server and data dir,
# and the build prints what it stamped before anything is published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the release tag belongs to main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

      - name: Verify the tag matches gradle.properties
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "pluginVersion $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the build is a release build
        run: |
          ./gradlew buildInfo -PtokitokiRelease=true --console=plain -q | tee build-info.txt
          grep -q "release=true server=https://tokitoki.dev dataDir=~/.tokitoki" build-info.txt

      - name: Test and build
        run: ./gradlew test buildPlugin -PtokitokiRelease=true --console=plain

      - name: Plugin compatibility
        run: ./gradlew verifyPlugin -PtokitokiRelease=true --console=plain

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "JETBRAINS_MARKETPLACE_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          ./gradlew publishPlugin -PtokitokiRelease=true --console=plain
